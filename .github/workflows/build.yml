name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Android Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1
          
      - name: Setup Capacitor & Build APK
        run: |
          
          mkdir www && cp index.html www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Neon Reaper" "com.neon.reaper" --web-dir www
          npx cap add android
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.3"/g' android/app/build.gradle
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonReaper-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
