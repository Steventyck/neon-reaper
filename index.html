<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON REAPER</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;outline:none}
body{background:#06060c;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;width:100vw;height:100vh}
canvas{display:block;width:100%;height:100%}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px;pointer-events:none;z-index:5}
.hid{display:none!important}
.int{pointer-events:auto}
button{touch-action:manipulation;cursor:pointer}
.mod{z-index:50}
#m-scr{z-index:10}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:10}
.cur-row{display:flex;gap:8px}
.pill{background:rgba(12,16,28,.88);border:1px solid rgba(0,240,255,.35);padding:7px 12px;border-radius:12px;font-weight:800;font-size:14px;backdrop-filter:blur(6px)}
.gld{color:#ffd700}.dia{color:#00f0ff}
.gear{width:40px;height:40px;border-radius:12px;background:rgba(12,16,28,.88);border:1px solid rgba(255,0,85,.5);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.title-wrap{text-align:center;margin-top:14px}
.title{font-size:40px;font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,#fff,#00f0ff 55%,#ff0055);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(0,240,255,.5));line-height:1}
.bot-menu{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:6px}
.btn-play{width:100%;padding:18px;border:none;border-radius:18px;font-size:24px;font-weight:900;letter-spacing:2px;color:#05050a;background:linear-gradient(90deg,#00f0ff,#00ff88);box-shadow:0 0 28px rgba(0,240,255,.65);cursor:pointer;animation:pls 1.6s infinite}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.nav4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nbtn{position:relative;background:rgba(14,18,32,.92);border:1px solid rgba(0,240,255,.35);border-radius:14px;padding:10px 4px;text-align:center;color:#fff;font-size:11px;font-weight:800;cursor:pointer}
.nbtn span{display:block;font-size:20px;margin-bottom:3px}
.dot{position:absolute;top:-5px;right:-4px;background:#ff0055;color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:99px}
#fps-box{position:fixed;top:6px;left:6px;background:rgba(0,0,0,.65);color:#00ff88;font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;z-index:99;pointer-events:none}

/* Модальные окна */
.mod{position:fixed;inset:0;background:rgba(6,6,12,.94);display:flex;flex-direction:column;padding:16px;z-index:999}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:10px}
.mtitle{font-size:20px;font-weight:900;color:#00f0ff;text-transform:uppercase}
.close{background:#ff0055;border:none;color:#fff;font-weight:900;padding:6px 12px;border-radius:10px;font-size:14px}
.scroll{flex:1;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.scroll *{touch-action:pan-y}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:rgba(18,22,38,.95);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.act{background:linear-gradient(90deg,#00f0ff,#00ff88);border:none;color:#05050a;font-weight:900;padding:8px;border-radius:10px;font-size:12px;cursor:pointer}
.act:disabled{opacity:.35}
.act-p{background:linear-gradient(90deg,#ff0055,#b829ff);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:8px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid transparent;color:#fff;font-weight:800;font-size:12px;text-align:center}
.tab.on{border-color:#00f0ff;background:rgba(0,240,255,.15);color:#00f0ff}
.r0{border-color:#94a3b8;color:#cbd5e1}.r1{border-color:#00f0ff;color:#00f0ff}.r2{border-color:#c084fc;color:#c084fc}.r3{border-color:#ffd700;color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.25)}

/* HUD в бою */
#hud{padding:12px}
.xp-bar{width:calc(100% - 108px);height:9px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;border:1px solid rgba(0,240,255,.4)}
.xp-in{height:100%;width:0%;background:linear-gradient(90deg,#00f0ff,#ff0055)}
.hud-info{width:calc(100% - 108px);display:flex;justify-content:space-between;font-size:12px;font-weight:900;margin-top:5px;text-shadow:0 1px 3px #000}
.boss-bar{width:calc(100% - 108px);margin-top:6px;background:rgba(0,0,0,.6);border:1px solid #ff0055;border-radius:8px;padding:3px}
.boss-in{height:6px;background:#ff0055;border-radius:6px;width:100%}
.ult{position:fixed;bottom:26px;right:20px;width:72px;height:72px;border-radius:50%;border:3px solid #ff0055;background:radial-gradient(#ff0055,#2b0010);color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;opacity:.35}
.ult.rdy{opacity:1;box-shadow:0 0 24px #ff0055;animation:pls 1s infinite}
.roul-box{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;text-align:center}
.roul-slot{font-size:26px;font-weight:900;padding:24px;border-radius:20px;border:2px solid #ffd700;background:rgba(20,24,42,.95);min-width:260px}
</style>
</head>
<body>

<div id="fps-box" class="hid">FPS: 60</div>
<canvas id="c"></canvas>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="m-scr" class="scr">
  <div class="top int" style="gap:6px">
    <button class="pill" id="btn-prof" style="cursor:pointer;display:flex;align-items:center;gap:5px;border-color:#00f0ff;color:#fff;font-weight:800">👤 <span id="u-name">Игрок</span></button>
    <div class="cur-row" style="margin-left:auto">
      <div class="pill gld">💰 <span id="u-gld">0</span></div>
      <div class="pill dia">💎 <span id="u-dia">0</span></div>
    </div>
    <button class="gear" id="btn-set">⚙️</button>
  </div>
  <div class="title-wrap"><div class="title">NEON<br>REAPER</div></div>
  <div class="bot-menu int">
    <button class="btn-play" id="btn-play">ИГРАТЬ</button>
    <div class="nav4">
      <button class="nbtn" id="nav-shop"><span>📦</span>Магазин</button>
      <button class="nbtn" id="nav-upg"><span>⚡</span>Прокачка</button>
      <button class="nbtn" id="nav-inv"><span>🎒</span>Инвентарь<div class="dot hid" id="dot-box">0</div></button>
      <button class="nbtn" id="nav-ach"><span>🏆</span>Ачивки<div class="dot hid" id="dot-ach">0</div></button>
    </div>
  </div>
</div>

<!-- HUD БОЯ -->
<div id="hud" class="scr hid">
  <div style="display:flex;align-items:flex-start;gap:8px;width:calc(100% - 104px)">
    <button class="gear int" id="btn-pause" style="width:34px;height:34px;font-size:15px;flex-shrink:0">⏸</button>
    <div style="flex:1">
      <div class="xp-bar" style="width:100%"><div class="xp-in" id="h-xp"></div></div>
      <div class="hud-info" style="width:100%">
        <span class="dia" id="h-lvl">LVL 1</span>
        <span id="h-wave">ВОЛНА 1</span>
        <span class="gld">💰 <span id="h-gld">0</span></span>
      </div>
      <div id="h-cards" style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap"></div>
      <div class="boss-bar hid" id="h-boss-w" style="width:100%">
        <div id="h-boss-n" style="font-size:9px;font-weight:900;text-align:center;color:#ffd700;margin-bottom:2px"></div>
        <div class="boss-in" id="h-boss"><div>
      </div>
    </div>
  </div>
  <div class="ult int" id="btn-ult">УЛЬТА<br>0%</div>
</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="modal" class="mod hid">
  <div class="mhead">
    <div class="mtitle" id="m-title">ОКНО</div>
    <button class="close" id="m-close">✕</button>
  </div>
  <div id="m-body" class="scroll"></div>
</div>

<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function rsz(){W=C.width=innerWidth;H=C.height=innerHeight}addEventListener('resize',rsz);rsz();

// ДАННЫЕ И СОХРАНЕНИЕ
const DEF={
  gld:150,dia:50,
  name:'Игрок',nameChanged:false,
  set:{fps:0,showFps:false,snd:true,vib:true,hi:true},
  upg:Array(12).fill(0),
    boxes:[1,0,0,0],
  cardSlot:false,
  inv:[],
  eq:{0:null,1:null,2:null,3:null,4:null,5:null},
  stat:{kills:0,bestSec:0,boss:0,opened:0,merged:0,upgs:0,ults:0,goldTot:0,cardsTot:0,bestWave:1,superBoss:0,eqCnt:0},
  achDone:Array(36).fill(false)
};
let D=JSON.parse(localStorage.getItem('nr_save_v2'))||JSON.parse(JSON.stringify(DEF));
if(!D.stat.ults)D.stat.ults=0;
if(!D.name)D.name='Игрок';
if(!D.stat.goldTot)D.stat.goldTot=0;
if(!D.stat.cardsTot)D.stat.cardsTot=0;
if(!D.stat.bestWave)D.stat.bestWave=1;
if(!D.stat.superBoss)D.stat.superBoss=0;
D.stat.eqCnt=Object.values(D.eq).filter(Boolean).length;
while(D.achDone.length<36)D.achDone.push(false);
function save(){D.stat.eqCnt=Object.values(D.eq).filter(Boolean).length;localStorage.setItem('nr_save_v2',JSON.stringify(D));updTop()}

// ЗВУК
const AC=new(window.AudioContext||window.webkitAudioContext)();
function snd(f,t='triangle',d=.08,v=.06){
  if(!D.set.snd)return;
  try{if(AC.state==='suspended')AC.resume();let o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,AC.currentTime);o.frequency.exponentialRampToValueAtTime(40,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}
}
function vib(ms=25){if(D.set.vib&&navigator.vibrate)navigator.vibrate(ms)}

// КОНФИГИ ЭКИПИРОВКИ (6 слотов x 5 видов = 30 вещей)
const SLOTS=['Шлем','Нагрудник','Перчатки','Оружие','Поножи','Сапоги'];
const ITEMS=[
  ['Визор скаута','Шлем берсерка','Капюшон тени','Титан-маска','Корона жнеца'],
  ['Кибер-жилет','Броня паладина','Плащ призрака','Экзоскелет','Реактор-панцирь'],
  ['Перчатки стрелка','Когти хищника','Магнит-краги','Рукавицы титана','Перчатки крита'],
  ['Плазма-пистолет','Лазерная коса','Цепной шокер','Огне-дробовик','Клинок пустоты'],
  ['Поножи бегуна','Щитки стража','Штаны барыги','Грави-поножи','Ноги киборга'],
  ['Кеды ниндзя','Грави-боты','Сапоги штурма','Реактив-бутсы','Шаги тени']
];
const RAR=['Обычный','Редкий','Эпический','Легендарный'];
const R_MULT=[1,1.8,3.2,5.5];
const CHESTS=[
  {n:'Обычный сундук',c:150,cur:'gld',p:[70,25,4.5,.5],r:0},
  {n:'Редкий сундук',c:50,cur:'dia',p:[30,50,17,3],r:1},
  {n:'Эпический сундук',c:150,cur:'dia',p:[0,45,45,10],r:2},
  {n:'Легендарный сундук',c:400,cur:'dia',p:[0,0,65,35],r:3}
];
const SLOT_W=[15,18,15,22,15,15];

// 12 ТАЛАНТОВ ПРОКАЧКИ
const UPGS=[
  {n:'⚔️ Сила атаки',max:50,txt:l=>`+${l*12}% урон`},
  {n:'⚡ Скорость атаки',max:10,txt:function(l){return '+'+(Math.min(l,10)*5)+'% скор.'}},
  {n:'🧲 Дальность сбора',max:25,txt:l=>`${75+l*15} px`},
  {n:'🎯 Шанс крита',max:30,txt:l=>`${(5+l*1.5).toFixed(1)}%`},
  {n:'💥 Крит. урон',max:35,txt:l=>`+${50+l*10}%`},
  {n:'👟 Скорость бега',max:8,txt:function(l){return '+'+(Math.min(l,8)*3)+'%'}},
  {n:'💰 Жадность',max:40,txt:l=>`+${l*5}% монет`},
  {n:'❤️ Макс. здоровье',max:50,txt:l=>`${100+l*25} HP`},
  {n:'🛡️ Броня',max:30,txt:l=>`-${l*2} урона`},
  {n:'💚 Регенерация',max:30,txt:function(l){return (l*0.5).toFixed(1)+'/с'}},
  {n:'🩸 Вампиризм',max:25,txt:function(l){return (l*0.4).toFixed(1)+'% шанс'}},
  {n:'🌀 Перезарядка ульты',max:30,txt:function(l){return '-'+(l*1.5).toFixed(1)+'%'}}
];

const ACHS=[
  {n:'💀 Истребитель I',g:100,k:'kills',d:30},{n:'💀 Истребитель II',g:1000,k:'kills',d:100},{n:'💀 Истребитель III',g:5000,k:'kills',d:300},
  {n:'⏱️ Выживший I',g:60,k:'bestSec',d:40},{n:'⏱️ Выживший II',g:180,k:'bestSec',d:120},{n:'⏱️ Выживший III',g:300,k:'bestSec',d:350},
  {n:'👹 Охотник боссов I',g:1,k:'boss',d:50},{n:'👹 Охотник боссов II',g:5,k:'boss',d:150},{n:'👹 Охотник боссов III',g:15,k:'boss',d:400},
  {n:'📦 Лудоман I',g:3,k:'opened',d:30},{n:'📦 Лудоман II',g:15,k:'opened',d:100},{n:'📦 Лудоман III',g:40,k:'opened',d:250},
  {n:'⚒️ Мастер кузни I',g:1,k:'merged',d:40},{n:'⚒️ Мастер кузни II',g:5,k:'merged',d:120},{n:'⚒️ Мастер кузни III',g:15,k:'merged',d:300},
  {n:'⚡ Эволюция I',g:10,k:'upgs',d:30},{n:'⚡ Эволюция II',g:50,k:'upgs',d:90},{n:'⚡ Эволюция III',g:150,k:'upgs',d:250},
  {n:'🔥 Повелитель ульты I',g:3,k:'ults',d:25},{n:'🔥 Повелитель ульты II',g:15,k:'ults',d:70},{n:'🔥 Повелитель ульты III',g:50,k:'ults',d:180},
  {n:'💰 Золотоискатель I',g:500,k:'goldTot',d:25},{n:'💰 Золотоискатель II',g:3000,k:'goldTot',d:75},{n:'💰 Золотоискатель III',g:15000,k:'goldTot',d:200},
  {n:'🃏 Коллекционер карт I',g:5,k:'cardsTot',d:30},{n:'🃏 Коллекционер карт II',g:20,k:'cardsTot',d:90},{n:'🃏 Коллекционер карт III',g:60,k:'cardsTot',d:300},
  {n:'🌊 Покоритель волн I',g:5,k:'bestWave',d:30},{n:'🌊 Покоритель волн II',g:12,k:'bestWave',d:80},{n:'🌊 Покоритель волн III',g:25,k:'bestWave',d:220},
  {n:'👑 Убийца Супер-боссов I',g:1,k:'superBoss',d:60},{n:'👑 Убийца Супер-боссов II',g:3,k:'superBoss',d:150},{n:'👑 Убийца Супер-боссов III',g:10,k:'superBoss',d:350},
  {n:'👕 Модник I',g:2,k:'eqCnt',d:20},{n:'👕 Модник II',g:4,k:'eqCnt',d:50},{n:'👕 Модник III',g:6,k:'eqCnt',d:120}                                          
];

function updTop(){
  document.getElementById('u-gld').textContent=D.gld;
  let un=document.getElementById('u-name');if(un)un.textContent=D.name;
  document.getElementById('u-dia').textContent=D.dia;
  let bCnt=D.boxes.reduce(function(a,b){return a+b},0);
  let db=document.getElementById('dot-box');db.textContent=bCnt;db.classList.toggle('hid',bCnt===0);
  let aCnt=ACHS.filter(function(a,i){return !D.achDone[i]&&D.stat[a.k]>=a.g}).length;
  let da=document.getElementById('dot-ach');da.textContent=aCnt;da.classList.toggle('hid',aCnt===0);
  document.getElementById('fps-box').classList.toggle('hid',!D.set.showFps);
}

function getStats(){
  let u=D.upg;
  let st={
    dmg:20*(1+u[0]*0.12),aspd:1+Math.min(u[1],10)*0.05,mag:75+u[2]*15,crit:5+u[3]*1.5,
    cdmg:0.5+u[4]*0.10,spd:3.2*(1+Math.min(u[5],8)*0.03),gold:1+u[6]*0.05,hp:100+u[7]*25,
    arm:u[8]*2,reg:u[9]*0.5,vamp:u[10]*0.4,ult:1+u[11]*0.015
  };
  Object.values(D.eq).forEach(function(it){
    if(!it)return;
    let m=R_MULT[it.r];
    if(it.s===0)st.hp+=35*m;
    if(it.s===1){st.arm+=3*m;st.reg+=0.4*m}
    if(it.s===2){st.aspd+=0.08*m;st.crit+=2*m}
    if(it.s===3)st.dmg+=10*m;
    if(it.s===4){st.mag+=20*m;st.gold+=0.08*m}
    if(it.s===5)st.spd+=0.25*m;
  });
  return st;
}

const mod=document.getElementById('modal'),mTitle=document.getElementById('m-title'),mBody=document.getElementById('m-body');
document.getElementById('m-close').onclick=function(){mod.classList.add('hid');if(stMode==='PAUSE')stMode='PLAY'};
function openMod(title,fn){mTitle.textContent=title;mBody.innerHTML='';fn(mBody);mod.classList.remove('hid');mod.style.zIndex='999';void mod.offsetHeight}
document.getElementById('btn-prof').onclick=function(){
  openMod('Профиль игрока',function(b){
    let cost=D.nameChanged?50:0;
    let can=cost===0||D.dia>=cost;
    b.innerHTML='<div class="card" style="align-items:center;text-align:center;gap:8px">'+
      '<div style="font-size:18px;font-weight:900;color:#00f0ff">👤 '+D.name+'</div>'+
      '<div style="display:flex;gap:6px;width:100%">'+
        '<input id="inp-name" maxlength="14" value="'+D.name+'" placeholder="Новый ник..." style="flex:1;padding:10px;border-radius:10px;border:1px solid #00f0ff;background:#0a0f1d;color:#fff;font-weight:700">'+
        '<button class="act" id="btn-ren" style="width:auto;padding:10px 14px" '+(can?'':'disabled')+'>'+(cost===0?'Бесплатно':'50 💎')+'</button>'+
      '</div>'+
      '<div style="font-size:11px;color:#94a3b8">'+(D.nameChanged?'Следующая смена ника стоит 50 💎':'Первая смена ника — бесплатно!')+'</div>'+
    '</div>'+
    '<div class="card" style="font-size:13px;gap:6px"><b>Боевая статистика</b>'+
      '<div style="display:flex;justify-content:space-between"><span>💀 Убито врагов:</span><b>'+D.stat.kills+'</b></div>'+
      '<div style="display:flex;justify-content:space-between"><span>⏱️ Рекорд времени:</span><b>'+D.stat.bestSec+' сек</b></div>'+
      '<div style="display:flex;justify-content:space-between"><span>🌊 Макс. волна:</span><b>'+D.stat.bestWave+'</b></div>'+
      '<div style="display:flex;justify-content:space-between"><span>👹 Убито боссов:</span><b>'+D.stat.boss+'</b></div>'+
      '<div style="display:flex;justify-content:space-between"><span>👑 Супер-боссов:</span><b>'+D.stat.superBoss+'</b></div>'+
    '</div>';
    b.querySelector('#btn-ren').onclick=function(){
      let nv=b.querySelector('#inp-name').value.trim();
      if(!nv||nv===D.name)return;
      if(D.nameChanged&&D.dia<50)return;
      if(D.nameChanged)D.dia-=50;
      D.name=nv;D.nameChanged=true;save();snd(700,'sine',.15);
      document.getElementById('btn-prof').click();
    };
  });
};

// Генератор 30 уникальных пиксель-арт иконок из кубиков для каждого предмета (6 слотов x 5 видов)
const EQ_ICO={};
function getEqIcon(s,v,r){
  let key=s+'_'+v+'_'+r;
  if(EQ_ICO[key])return EQ_ICO[key];
  const rCol=['#cbd5e1','#38bdf8','#c084fc','#ffd700'][r];
  const dCol=['#475569','#0284c7','#7e22ce','#b45309'][r];
  let cv=document.createElement('canvas');cv.width=36;cv.height=36;

let invTab=0;
function rollItem(chestIdx){
  const probs=[[70,25,4.5,0.5],[30,50,17,3],[0,45,45,10],[0,0,65,35]];
  const sw=[15,18,15,22,15,15];
  let p=probs[chestIdx],rnd=Math.random()*100,acc=0,r=0;
  for(let i=0;i<4;i++){acc+=p[i];if(rnd<=acc){r=i;break}}
  let sr=Math.random()*100,sacc=0,s=0;
  for(let i=0;i<6;i++){sacc+=sw[i];if(sr<=sacc){s=i;break}}
  return{id:Date.now()+Math.random(),s:s,v:Math.floor(Math.random()*5),r:r};
}

        walls.push(w1);

}

function addParts(x,y,col,n,sp){
  if(!D.set.hi)n=Math.ceil(n/3);
  for(let i=0;i<n;i++){let a=Math.random()*6.28,s=Math.random()*(sp||4)+1;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:22,c:col})}
}

function hitWall(x,y,r){
  for(let i=0;i<walls.length;i++){
    let w=walls[i];if(w.op<0.85)continue;
    if(x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h)return true;
  }
  return false;
}
function addDmg(x,y,val,crit){
  if(!D.set.hi)return;
  dmgs.push({x:x+(Math.random()-.5)*14,y:y-10,v:Math.round(val)+(crit?'!':''),c:crit?'#ffd700':'#fff',l:26});
}

function hasLOS(x1,y1,x2,y2){
  let dist=Math.hypot(x2-x1,y2-y1),steps=Math.ceil(dist/20);
  for(let i=1;i<steps;i++){
    let t=i/steps;
    if(hitWall(x1+(x2-x1)*t,y1+(y2-y1)*t,3))return false;
  }
  return true;
  }
       
function spawnMob(){
  for(let tr=0;tr<10;tr++){
    let a=Math.random()*6.28,d=450+Math.random()*260;
    let ex=Math.max(40,Math.min(MAP-40,P.x+Math.cos(a)*d));
    let ey=Math.max(40,Math.min(MAP-40,P.y+Math.sin(a)*d));
    let roll=Math.random(),tier=0;
    if(wave>=3&&roll<0.28)tier=1;
    if(wave>=6&&roll<0.12)tier=2;
    let r=tier===2?20:tier===1?14:11;
    if(Math.hypot(ex-P.x,ey-P.y)>=430&&!hitWall(ex,ey,r+4)){
      let sc=1+wave*0.12;
      ens.push({x:ex,y:ey,r:r,hp:(tier===2?160:tier===1?55:24)*sc,spd:tier===2?1.05:tier===1?2.1:1.45,col:tier===2?'#b829ff':tier===1?'#ff6b00':'#ff0055',tier:tier,boss:false,hit:0});
      break;
    }
  }
}

function spawnWave(){
  let isElite=(wave%10===0);
  let isBoss=(!isElite&&wave%5===0);
  if(isElite||isBoss){
    let bType=Math.floor(Math.random()*5);
    let ba=Math.random()*6.28,bd=460;
    let bx=Math.max(150,Math.min(MAP-150,P.x+Math.cos(ba)*bd));
    let by=Math.max(150,Math.min(MAP-150,P.y+Math.sin(ba)*bd));
    let clearR=isElite?420:130;
    walls=walls.filter(function(w){
      let d=Math.hypot((w.x+w.w/2)-bx,(w.y+w.h/2)-by);
      if(d<clearR){addParts(w.x+w.w/2,w.y+w.h/2,'#00f0ff',12,6);return false}
      return true;
    });
    if(isElite){vib(80);snd(110,'square',.4)}
    let hp=isElite?4500*(1+wave*0.35):1900*(1+wave*0.28);
    ens.push({x:bx,y:by,r:isElite?36:28,hp:hp,mhp:hp,spd:1.15,col:isElite?'#ff0055':'#ffd700',boss:true,elite:isElite,bType:bType,st:0,ang:0,hit:0});
  }
  for(let i=0;i<5;i++)spawnMob();
}

let frm=0;
function update(){
  frm++;if(stMode==='PAUSE'||stMode==='OVER')return;
  let demo=(stMode==='MENU');

  walls.forEach(function(w){if(w.grow&&w.op<1){if(Math.hypot(P.x-(w.x+w.w/2),P.y-(w.y+w.h/2))>80)w.op=Math.min(1,w.op+0.008)}});

  if(demo){
    P.x=MAP/2+Math.cos(frm*0.02)*120;P.y=MAP/2+Math.sin(frm*0.025)*90;
    if(ens.length<6&&frm%40===0)ens.push({x:P.x+220,y:P.y-150,r:12,hp:30,spd:1.5,col:'#ff0055',tier:0,boss:false,hit:0});
  } else {
    runSec+=1/60;waveT+=1/60;
    P.hp=Math.min(P.mhp,P.hp+P.reg/60);
    let nx=Math.max(25,Math.min(MAP-25,P.x+joy.dx*P.spd));
    let ny=Math.max(25,Math.min(MAP-25,P.y+joy.dy*P.spd));
    if(!hitWall(nx,P.y,P.r))P.x=nx;
    if(!hitWall(P.x,ny,P.r))P.y=ny;
        let spawnCd=Math.max(14,Math.floor(55-wave*2.5));
    if(frm%spawnCd===0&&ens.length<45)spawnMob();
    if(waveT>20){wave++;waveT=0;spawnWave()}
      }
    P.ft++;
  if(P.ft>=P.fr&&ens.length>0){
    let vis=ens.filter(function(e){return hasLOS(P.x,P.y,e.x,e.y)});
    if(vis.length>0){
      let near=vis.reduce(function(a,b){return Math.hypot(a.x-P.x,a.y-P.y)<Math.hypot(b.x-P.x,b.y-P.y)?a:b});
      let ba=Math.atan2(near.y-P.y,near.x-P.x);
      P.ang=ba;
      for(let m=0;m<P.multi;m++){let a=ba+(m-(P.multi-1)/2)*0.16;buls.push({x:P.x,y:P.y,vx:Math.cos(a)*9.5,vy:Math.sin(a)*9.5,l:65})}
      P.ft=0;if(!demo)snd(520,'triangle',.05,.025);
    }
  } else if(joy.on){P.ang=Math.atan2(joy.dy,joy.dx)}

  if(P.light>0&&ens.length>0){
    P.lt++;if(P.lt>=Math.max(32,88-P.light*10)){
      P.lt=0;
      let maxJumps=Math.min(5,1+Math.ceil(P.light/2));
      let hitList=[],pts=[{x:P.x,y:P.y}],curX=P.x,curY=P.y;
      for(let k=0;k<maxJumps;k++){
        let cand=ens.filter(function(en){return hitList.indexOf(en)===-1&&Math.hypot(en.x-curX,en.y-curY)<240});
        if(!cand.length)break;
        let nxt=cand.reduce(function(a,b){return Math.hypot(a.x-curX,a.y-curY)<Math.hypot(b.x-curX,b.y-curY)?a:b});
        hitList.push(nxt);pts.push({x:nxt.x,y:nxt.y});
        let ld=P.dmg*(0.9+P.light*0.3);nxt.hp-=ld;nxt.hit=5;
        addParts(nxt.x,nxt.y,'#00f0ff',5,3);if(!demo)addDmg(nxt.x,nxt.y,ld,false);
        curX=nxt.x;curY=nxt.y;
      }
      if(pts.length>1){bolts.push({pts:pts,l:10});if(!demo)snd(720,'sawtooth',.07,.03)}
    }
  }

  P.bAng+=0.08;let bPos=[];
  for(let i=0;i<P.blades;i++){let a=P.bAng+(6.28/P.blades)*i;bPos.push({x:P.x+Math.cos(a)*58,y:P.y+Math.sin(a)*58})}
  P.bPos=bPos;

    for(let i=buls.length-1;i>=0;i--){
    let b=buls[i];b.x+=b.vx;b.y+=b.vy;b.l--;
    if(b.l<=0||hitWall(b.x,b.y,3)){buls.splice(i,1);continue}
    for(let j=0;j<ens.length;j++){
      let e=ens[j];
      if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+6){
        let crit=Math.random()*100<P.crit;
        let dmg=P.dmg*(crit?(1+P.cdmg):1);
        e.hp-=dmg;e.hit=4;addParts(b.x,b.y,crit?'#ffd700':'#00f0ff',4,3);
        if(!demo)addDmg(e.x,e.y,dmg,crit);
        buls.splice(i,1);break;
      }
    }
  }

  for(let i=ebuls.length-1;i>=0;i--){
    let b=ebuls[i];
    if(b.hom){let a=Math.atan2(P.y-b.y,P.x-b.x);b.vx+=Math.cos(a)*0.15;b.vy+=Math.sin(a)*0.15}
    b.x+=b.vx;b.y+=b.vy;b.l--;
    if(b.l<=0||hitWall(b.x,b.y,4)){ebuls.splice(i,1);continue}
    if(!demo&&Math.hypot(b.x-P.x,b.y-P.y)<P.r+6){
      P.hp-=Math.max(2,14-P.arm);shk=6;ebuls.splice(i,1);
      if(P.hp<=0){endRun();return}
    }
  }

  let bossObj=null;
  for(let i=ens.length-1;i>=0;i--){
    let e=ens[i];if(e.boss)bossObj=e;
    let a=Math.atan2(P.y-e.y,P.x-e.x);
    if(e.elite){
      walls=walls.filter(function(w){
        if(e.x+e.r+6>w.x&&e.x-e.r-6<w.x+w.w&&e.y+e.r+6>w.y&&e.y-e.r-6<w.y+w.h){
          addParts(w.x+w.w/2,w.y+w.h/2,'#00f0ff',14,6);snd(130,'square',.2);return false;
        }
        return true;
      });
    }
    let nx=e.x+Math.cos(a)*e.spd,ny=e.y+Math.sin(a)*e.spd;
    let hx=hitWall(nx,e.y,e.r),hy=hitWall(e.x,ny,e.r);
    if(!hx)e.x=nx;
    if(!hy)e.y=ny;
    if(hx&&hy){
      if(!e.stDir)e.stDir=Math.random()<.5?1:-1;
      let sa=a+e.stDir*1.35;
      let sx=e.x+Math.cos(sa)*e.spd,sy=e.y+Math.sin(sa)*e.spd;
      if(!hitWall(sx,e.y,e.r))e.x=sx;
      if(!hitWall(e.x,sy,e.r))e.y=sy;
    } else if(!hx&&!hy){e.stDir=0}
    if(e.hit>0)e.hit--;

    if(e.boss&&!demo){
      e.st++;e.ang+=0.06;
      if(e.bType===0&&e.st%85===0){for(let k=0;k<3;k++)setTimeout(function(){ebuls.push({x:e.x,y:e.y,vx:Math.cos(a)*7.5,vy:Math.sin(a)*7.5,l:110})},k*120)}
      if(e.bType===1&&e.st%110===0){for(let k=0;k<12;k++){let ca=k*6.28/12;ebuls.push({x:e.x,y:e.y,vx:Math.cos(ca)*4.2,vy:Math.sin(ca)*4.2,l:130})}}
      if(e.bType===2&&e.st%90===0){for(let k=-3;k<=3;k++){let sa=a+k*0.18;ebuls.push({x:e.x,y:e.y,vx:Math.cos(sa)*5.5,vy:Math.sin(sa)*5.5,l:90})}}
      if(e.bType===3&&e.st%18===0){ebuls.push({x:e.x,y:e.y,vx:Math.cos(e.ang)*4.5,vy:Math.sin(e.ang)*4.5,l:120})}
      if(e.bType===4&&e.st%120===0){ebuls.push({x:e.x,y:e.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,l:150,hom:true})}
    }

    for(let j=0;j<bPos.length;j++){let bp=bPos[j];if(Math.hypot(bp.x-e.x,bp.y-e.y)<e.r+11){e.hp-=P.dmg*0.25;e.hit=3}}

    if(!demo&&Math.hypot(P.x-e.x,P.y-e.y)<P.r+e.r){
      P.hp-=Math.max(0.1,(e.boss?1.2:0.45)-P.arm*0.02);shk=4;
      if(P.hp<=0){endRun();return}
    }

    if(e.hp<=0){
      addParts(e.x,e.y,e.col,e.boss?28:8,e.boss?7:4);
      if(!demo){
        D.stat.kills++;
        if(Math.random()*100<P.vamp)P.hp=Math.min(P.mhp,P.hp+P.mhp*0.05);
        ult=Math.min(100,ult+(e.boss?35:4)*P.ultM);
        let mult=(1+runSec/60*0.25)*P.goldM;
        let xpMult=1+(wave-1)*0.22;
        let gVal=Math.ceil((e.boss?60:e.tier===2?15:e.tier===1?6:2)*mult);
        let xVal=Math.ceil((e.boss?30:e.tier===2?8:e.tier===1?3:1)*xpMult);
        let a1=Math.random()*6.28,a2=a1+2.2+Math.random();
        let xSz=e.boss?11:e.tier===2?9:e.tier===1?6.5:4.5;
        drops.push({x:e.x,y:e.y,vx:Math.cos(a1)*4.5,vy:Math.sin(a1)*4.5,t:'g',v:gVal});
        drops.push({x:e.x,y:e.y,vx:Math.cos(a2)*4.5,vy:Math.sin(a2)*4.5,t:'x',v:xVal,sz:xSz});
        if(e.boss||(e.tier===2&&Math.random()<0.35)){
          let a3=a2+2.1;
          drops.push({x:e.x,y:e.y,vx:Math.cos(a3)*5,vy:Math.sin(a3)*5,t:'h',v:1});
        }
        if(e.boss){
          D.stat.boss++;
          if(e.elite){D.stat.superBoss++;showRoulette()}
          else{let dGain=10+Math.floor(wave/5)*3;D.dia+=dGain;save();snd(800,'sine',.25)}
        }
      }
      ens.splice(i,1);
    }
  }

  for(let i=drops.length-1;i>=0;i--){
    let d=drops[i];
    if(d.vx){d.x+=d.vx;d.y+=d.vy;d.vx*=0.85;d.vy*=0.85}
    let dist=Math.hypot(P.x-d.x,P.y-d.y);
    if(dist<P.mag){d.x+=(P.x-d.x)*0.18;d.y+=(P.y-d.y)*0.18}
    if(dist<P.r+10){
      if(d.t==='g')runGld+=d.v;
      else if(d.t==='h'){P.hp=Math.min(P.mhp,P.hp+P.mhp*0.20);addParts(P.x,P.y,'#00ff88',10,4);if(!demo)snd(680,'sine',.12)}
      else{P.xp+=d.v;if(P.xp>=P.nxp){P.xp-=P.nxp;P.lvl++;P.nxp=Math.floor(P.nxp*1.35);showLevelCards()}}
      drops.splice(i,1);
    }
  }

  parts.forEach(function(p,i){p.x+=p.vx;p.y+=p.vy;p.l--;if(p.l<=0)parts.splice(i,1)});
  dmgs.forEach(function(d,i){d.y-=0.6;d.l--;if(d.l<=0)dmgs.splice(i,1)});
  bolts.forEach(function(bt,i){bt.l--;if(bt.l<=0)bolts.splice(i,1)});
  if(shk>0)shk*=0.85;

  if(!demo&&frm%8===0){
    document.getElementById('h-xp').style.width=(P.xp/P.nxp*100)+'%';
    document.getElementById('h-lvl').textContent='LVL '+P.lvl;
    document.getElementById('h-wave').textContent='ВОЛНА '+wave;
    document.getElementById('h-gld').textContent=runGld;
    let ub=document.getElementById('btn-ult');
    ub.innerHTML=ult>=100?'УЛЬТА<br>ГОТОВА!':'УЛЬТА<br>'+Math.floor(ult)+'%';
    ub.classList.toggle('rdy',ult>=100);
    let bw=document.getElementById('h-boss-w');
  if(bossObj){
    bw.classList.remove('hid');
    document.getElementById('h-boss-n').textContent=(bossObj.elite?'👑 СУПЕР ':'')+BOSS_NAMES[bossObj.bType];
    document.getElementById('h-boss').style.width=(bossObj.hp/bossObj.mhp*100)+'%';
  } else bw.classList.add('hid');
  }
}

function draw(){
  X.fillStyle='#06060c';X.fillRect(0,0,W,H);
  if(!P)return;

  X.save();
  let cx=W/2-P.x+(shk>0.5?(Math.random()-.5)*shk:0);
  let cy=H/2-P.y+(shk>0.5?(Math.random()-.5)*shk:0);
  X.translate(cx,cy);

  X.strokeStyle='rgba(0,240,255,0.05)';X.lineWidth=1;
  for(let x=0;x<=MAP;x+=80){X.beginPath();X.moveTo(x,0);X.lineTo(x,MAP);X.stroke()}
  for(let y=0;y<=MAP;y+=80){X.beginPath();X.moveTo(0,y);X.lineTo(MAP,y);X.stroke()}
  X.strokeStyle='#ff0055';X.lineWidth=4;X.strokeRect(0,0,MAP,MAP);

  walls.forEach(function(w){
    X.fillStyle='rgba(0,240,255,'+(0.18*w.op)+')';
    X.strokeStyle='rgba(0,240,255,'+(0.85*w.op)+')';
    X.lineWidth=2;X.fillRect(w.x,w.y,w.w,w.h);X.strokeRect(w.x,w.y,w.w,w.h);
  });

  drops.forEach(function(d){
    if(d.t==='h'){
      X.fillStyle='#00ff88';X.fillRect(d.x-6,d.y-2,12,4);X.fillRect(d.x-2,d.y-6,4,12);
      X.fillStyle='#fff';X.fillRect(d.x-4,d.y-1,8,2);X.fillRect(d.x-1,d.y-4,2,8);
    } else if(d.t==='g'){
      X.fillStyle='#ffd700';X.beginPath();X.arc(d.x,d.y,3.5,0,6.28);X.fill();
    } else {
      let sz=d.sz||4;
      X.fillStyle=sz>=9?'#00f0ff':'#00ff88';
      X.beginPath();X.moveTo(d.x,d.y-sz);X.lineTo(d.x+sz,d.y);X.lineTo(d.x,d.y+sz);X.lineTo(d.x-sz,d.y);X.closePath();X.fill();
      if(sz>=7){X.fillStyle='#fff';X.fillRect(d.x-2,d.y-2,4,4)}
    }
  });

    ens.forEach(function(e){
    let sp=e.boss?(e.elite?SPR['sb'+e.bType]:SPR['b'+e.bType]):SPR['m'+e.tier];
    if(sp){
      X.save();X.translate(e.x,e.y);
      if(e.hit>0)X.globalAlpha=0.55;
      X.drawImage(sp,-sp.width/2,-sp.height/2);
      X.restore();
    }
  });

  X.fillStyle='#00f0ff';buls.forEach(function(b){X.fillRect(b.x-3,b.y-3,6,6)});
  X.fillStyle='#ff2a6d';ebuls.forEach(function(b){X.fillRect(b.x-4,b.y-4,8,8)});
  bolts.forEach(function(bt){
    X.strokeStyle='rgba(0,240,255,'+(bt.l/10)+')';X.lineWidth=2.5;
    X.beginPath();X.moveTo(bt.pts.at(0).x,bt.pts.at(0).y);
    for(let k=1;k<bt.pts.length;k++){
      let p1=bt.pts.at(k-1),p2=bt.pts.at(k);
      X.lineTo((p1.x+p2.x)/2+(Math.random()-.5)*14,(p1.y+p2.y)/2+(Math.random()-.5)*14);
      X.lineTo(p2.x,p2.y);
    }
    X.stroke();
  });
  X.save();X.translate(P.x,P.y);
  if(Math.cos(P.ang)<0)X.scale(-1,1);
  X.drawImage(SPR.hero,-SPR.hero.width/2,-SPR.hero.height/2);
  X.restore();

  if(stMode==='PLAY'){
    X.fillStyle='rgba(255,255,255,.2)';X.fillRect(P.x-18,P.y+22,36,4);
    X.fillStyle='#00ff88';X.fillRect(P.x-18,P.y+22,36*Math.max(0,P.hp/P.mhp),4);
  }
  if(P.bPos){X.fillStyle='#ff0055';P.bPos.forEach(function(bp){X.fillRect(bp.x-6,bp.y-6,12,12)})}

  parts.forEach(function(p){X.fillStyle=p.c;X.fillRect(p.x,p.y,3.5,3.5)});
  X.font='900 12px system-ui';X.textAlign='center';
  dmgs.forEach(function(d){X.fillStyle=d.c;X.fillText(d.v,d.x,d.y)});
  X.restore();

  if(joy.on&&stMode==='PLAY'){
    X.strokeStyle='rgba(0,240,255,.4)';X.lineWidth=2;X.beginPath();X.arc(joy.sx,joy.sy,42,0,6.28);X.stroke();
    X.fillStyle='rgba(0,240,255,.6)';X.beginPath();X.arc(joy.sx+joy.dx*35,joy.sy+joy.dy*35,15,0,6.28);X.fill();
  }

  if(stMode==='PLAY'){
    let ms=92,mx=W-ms-12,my=12,sc=ms/MAP;
    X.fillStyle='rgba(8,12,24,0.82)';X.fillRect(mx,my,ms,ms);
    X.strokeStyle='rgba(0,240,255,0.6)';X.lineWidth=1.5;X.strokeRect(mx,my,ms,ms);
    X.fillStyle='rgba(0,240,255,0.4)';
    walls.forEach(function(w){if(w.op>0.5)X.fillRect(mx+w.x*sc,my+w.y*sc,Math.max(2,w.w*sc),Math.max(2,w.h*sc))});
    ens.forEach(function(e){
      X.fillStyle=e.boss?'#ffd700':'#ff0055';
      X.beginPath();X.arc(mx+e.x*sc,my+e.y*sc,e.boss?3.8:1.6,0,6.28);X.fill();
    });
    X.fillStyle='#00ff88';X.beginPath();X.arc(mx+P.x*sc,my+P.y*sc,2.8,0,6.28);X.fill();
  }
}

let lastT=0,fpsCnt=0,fpsT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(D.set.fps>0){
    let minDt=1000/D.set.fps;
    if(now-lastT<minDt-1)return;
  }
  lastT=now;
  fpsCnt++;
  if(now-fpsT>=500){
    if(D.set.showFps)document.getElementById('fps-box').textContent='FPS: '+Math.round(fpsCnt*1000/(now-fpsT));
    fpsCnt=0;fpsT=now;
  }
  update();draw();
}
updTop();initRun(true);requestAnimationFrame(loop);
</script>
</body>
